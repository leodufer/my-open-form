  <rect x="32" y="410" width="896" height="98" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="56" cy="438" r="11" fill="#2563eb"/>
  <text x="52" y="442" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="76" y="442" font-size="12" fill="#334155"><tspan font-weight="600">Barra superior:</tspan> acceso directo a Mis formularios, Preguntas, Segmentos, Usuarios (solo admin) y Configuración.</text>

  <circle cx="56" cy="466" r="11" fill="#2563eb"/>
