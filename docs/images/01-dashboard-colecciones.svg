  <text x="76" y="470" font-size="12" fill="#334155"><tspan font-weight="600">Filtros de colección:</tspan> organizá formularios en General o nuevas colecciones y filtrá los recursos Compartidos conmigo.</text>

  <circle cx="56" cy="494" r="11" fill="#2563eb"/>
  <text x="52" y="498" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="76" y="498" font-size="12" fill="#334155"><tspan font-weight="600">Tarjetas de formulario:</tspan> editá preguntas, revisá respuestas, compartí con otros usuarios o mové entre colecciones.</text>
